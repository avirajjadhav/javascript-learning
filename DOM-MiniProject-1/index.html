<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Theme Color Switcher</title>
    <link rel="stylesheet" href="style.css">
  </head>
  <body>
    <div class="container">
      <h1>🌈 Background Color Changer</h1>
      <p>Choose a color below to change the background instantly.</p>

      <div class="color-container">
        <div class="color-box" id="yellow"></div>
        <div class="color-box" id="blue"></div>
        <div class="color-box" id="white"></div>
        <div class="color-box" id="grey"></div>
      </div>
      <p id="theme-text"></p>
    </div>
  </body>
  <script src="script.js"></script>
</html>
